name: Build GKD350H FCEUX OPK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git wget xz-utils squashfs-tools

      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Fetch FCEUX OpenDingux source
        run: git clone --depth 1 --branch opendingux https://github.com/plrguez/fceux-for-retrogame.git fceux

      - name: Modify GKD350H menu input
        run: |
          python3 patch_input.py
          grep -n -A14 -B2 "GKD350H intercepts" fceux/src/drivers/dingux-sdl/input.cpp

      - name: Install legacy GCW0 toolchain
        run: |
          wget -O /tmp/gcw0-toolchain.tar.bz2 https://github.com/Ninoh-FOX/toolchain/releases/download/08-09-2021/opendingux-gcw0-toolchain.2021-09-08.tar.bz2
          sudo mkdir -p /opt
          sudo tar -xjf /tmp/gcw0-toolchain.tar.bz2 -C /opt
          test -d /opt/gcw0-toolchain

      - name: Build OpenDingux 2014 OPK
        run: |
          cd fceux
          make TOOLCHAIN=/opt/gcw0-toolchain TARGET=fceux_gkd350h_lrmenu ODVERSION=2014 -f Makefile -j2
          find bin -maxdepth 1 -type f -name '*.opk' -ls

      - name: Upload OPK
        uses: actions/upload-artifact@v4
        with:
          name: fceux-gkd350h-lrmenu
          path: fceux/bin/*.opk
          if-no-files-found: error
